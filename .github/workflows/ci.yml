name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The lockfile is generated with npm 11, which resolves peers differently from npm 10.
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.11.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild bcrypt

      - name: Run tests
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  # Compiles the application, then builds the container image a release
  # publishes and starts it: a commit whose image does not build or does not
  # start cannot pass this check, which the branches require.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The lockfile is generated with npm 11, which resolves peers differently from npm 10.
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.11.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild bcrypt

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built as a release builds it, kept on the runner and never published.
      # The layers are cached between the runs of a pull request.
      - name: Build the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: skycrew-backend:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Entry point, migrations and e-mail templates are in the image, and it
      # starts against an empty database.
      - name: Check and start the image
        run: sh .github/scripts/image-smoke.sh skycrew-backend:ci
