name: CI

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lockfile is generated with npm 11, which resolves peers differently from npm 10.
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.11.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild bcrypt

      - name: Run tests
        run: npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lockfile is generated with npm 11, which resolves peers differently from npm 10.
      - name: Pin npm
        run: npm install --global --ignore-scripts npm@11.11.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native modules
        run: npm rebuild bcrypt

      - name: Build
        run: npm run build
