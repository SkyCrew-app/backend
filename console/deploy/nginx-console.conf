# nginx site of the SkyCrew console, written by install.sh with your address.
# Not enabled: follow "Installer la console" in the README of the console.
# certbot --nginx adds HTTPS to it and sends HTTP to HTTPS.

# Sign-in pages: at most 10 tries a minute per address (the console also locks).
limit_req_zone $binary_remote_addr zone=skycrew_console_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name CONSOLE_DOMAIN;

    access_log /var/log/nginx/skycrew-console.access.log;
    error_log  /var/log/nginx/skycrew-console.error.log;
    server_tokens off;
    client_max_body_size 1m;

    # To open the console to a few addresses only (home, office), uncomment
    # and complete; the Stripe address must stay open (see below).
    # allow 203.0.113.10;
    # deny all;

    location ~ ^/login {
        limit_req zone=skycrew_console_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:CONSOLE_PORT;
        include /etc/skycrew-console/nginx-proxy-headers.conf;
    }

    # Stripe's notifications: signed, checked by the console.
    location = /stripe/webhook {
        allow all;
        proxy_pass http://127.0.0.1:CONSOLE_PORT;
        include /etc/skycrew-console/nginx-proxy-headers.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:CONSOLE_PORT;
        include /etc/skycrew-console/nginx-proxy-headers.conf;
    }
}
